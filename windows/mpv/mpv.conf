# mpv efficient defaults
# Hardware decode (D3D11VA / zero-copy where possible)
hwdec=auto-safe
vo=gpu-next
gpu-api=d3d11

# Resume where you left off
save-position-on-quit=yes

# Don't show the separate OSD progress bar while seeking;
# the floating OSC seekbar already shows the position.
osd-on-seek=no

# Auto-load matching external subtitles/audio files
sub-auto=fuzzy
audio-file-auto=fuzzy

# Hide chapter markers on the seekbar for this movie only.
# mpv draws a triangle per chapter; this file has 37, which looks like a filmstrip.
# Remove this profile (or change the pattern) if you want the markers/chapters back.
[no-chapter-markers]
profile-cond=path:find("Spider%-Man")
chapters-file=~~/empty.ffmetadata
